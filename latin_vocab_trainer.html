<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latin Vocab Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one centered column on veined marble; each question card makes the Latin word its hero.
   Type encodes language: Latin is always set in Gentium, English and controls in Source Sans. */
:root {
  --bg: #f5f3f6;
  --surface: #ffffff;
  --sunk: #ece8ef;
  --ink: #1c1820;
  --muted: #625a68;
  --line: #dcd6e0;
  --accent: #74205a;          /* Tyrian purple */
  --accent-ink: #ffffff;
  --accent-soft: #f4e7f0;
  --good: #1b7345;  --good-soft: #e2f2e8;
  --bad: #b3261e;   --bad-soft: #fbe8e6;
  --warn: #8a5a00;  --warn-soft: #fbf0d9;
  --shadow: 0 1px 2px rgba(45, 20, 45, .06), 0 10px 28px rgba(45, 20, 45, .07);
  --f-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --f-latin: "Gentium Book Plus", "Gentium Plus", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --f-ui: "Source Sans 3", "Source Sans Pro", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131015; --surface: #1c181f; --sunk: #26212a; --ink: #eee9f1; --muted: #a89fae; --line: #362f3b;
    --accent: #e59ccb; --accent-ink: #2b0b1f; --accent-soft: #3a1e31;
    --good: #6fd39c; --good-soft: #15301f; --bad: #ff8e80; --bad-soft: #3b1a17; --warn: #f2c35e; --warn-soft: #33290f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131015; --surface: #1c181f; --sunk: #26212a; --ink: #eee9f1; --muted: #a89fae; --line: #362f3b;
  --accent: #e59ccb; --accent-ink: #2b0b1f; --accent-soft: #3a1e31;
  --good: #6fd39c; --good-soft: #15301f; --bad: #ff8e80; --bad-soft: #3b1a17; --warn: #f2c35e; --warn-soft: #33290f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 10px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--f-ui);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 44rem; margin: 0 auto; padding-inline: 16px; padding-block: 22px 40px; display: grid; gap: 16px; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top > div { min-width: 0; }
#settingsBtn { flex: none; }
.nw { white-space: nowrap; }
.eyebrow { margin: 0 0 2px; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 600 clamp(1.2rem, 0.95rem + 1.4vw, 1.55rem)/1.15 var(--f-display); letter-spacing: .04em; color: var(--accent); text-wrap: balance; }

.btn { border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 15px; line-height: 1.2; border: 1px solid transparent; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
@media (hover: hover) { .btn-primary:hover { filter: brightness(1.08); } }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
@media (hover: hover) { .btn-ghost:hover { border-color: var(--accent); color: var(--accent); } }
.btn-link { background: none; border: 0; padding: 4px 2px; color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.btn-link:hover { color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
kbd { font: 600 11px/1 var(--f-ui); padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .75; margin-left: 6px; }

/* ---------- status ---------- */
.status { display: grid; gap: 8px; }
.status-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.status-line strong { color: var(--ink); font-weight: 600; }
#endBtn { margin-left: auto; }
.bar { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); border-radius: inherit; }
.stats { display: flex; gap: 20px; flex-wrap: wrap; margin: 0; font-size: 14px; }
.stats div { display: flex; gap: 6px; align-items: baseline; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- question card ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 28px); display: grid; gap: 16px; min-width: 0; }
.card:focus { outline: none; }
.meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; background: var(--sunk); color: var(--ink); }
.qtype { margin-left: auto; font-weight: 600; color: var(--accent); }
.flag { color: var(--accent); font-weight: 600; }

.prompt { margin: 4px 0 0; font-family: var(--f-latin); font-size: clamp(2rem, 1.2rem + 3.4vw, 2.9rem); line-height: 1.15; overflow-wrap: anywhere; text-wrap: balance; }
.prompt.long { font-size: clamp(1.45rem, 1rem + 2vw, 2rem); line-height: 1.25; }
.prompt .lemma { font-weight: 700; }
.prompt .rest { color: var(--muted); }
.instr { margin: -6px 0 0; color: var(--muted); font-size: 15px; }

.options { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; text-align: left;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); line-height: 1.4; min-width: 0;
}
.opt .key { grid-row: span 2; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; background: var(--sunk); color: var(--muted); font-size: 13px; font-weight: 700; }
.opt .txt { min-width: 0; overflow-wrap: anywhere; padding-top: 2px; }
.opt .lat { grid-column: 2; font-family: var(--f-latin); font-style: italic; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
@media (hover: hover) {
  .opt:not([disabled]):hover { border-color: var(--accent); }
  .opt:not([disabled]):hover .key { color: var(--accent); }
}
.opt[disabled] { cursor: default; }
.opt.is-right { border-color: var(--good); background: var(--good-soft); }
.opt.is-right .key { background: var(--good); color: var(--surface); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .key { background: var(--bad); color: var(--surface); }
.opt.is-dim { opacity: .7; }

.sa { display: grid; gap: 10px; }
.sa input {
  width: 100%; padding: 12px 14px; font-size: 18px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface);
}
.sa input::placeholder { color: var(--muted); opacity: .8; }
.sa input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sa input.is-right { border-color: var(--good); }
.sa input.is-wrong { border-color: var(--bad); }
.sa input.is-close { border-color: var(--warn); }
.sa-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.hint { font-size: 14px; color: var(--warn); }

.feedback { border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; background: var(--sunk); }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback.close { background: var(--warn-soft); }
.verdict { margin: 0; font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.good .verdict { color: var(--good); }
.bad .verdict { color: var(--bad); }
.close .verdict { color: var(--warn); }
.verdict .glyph { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; line-height: 1; background: var(--muted); }
.good .glyph { background: var(--good); }
.bad .glyph { background: var(--bad); }
.close .glyph { background: var(--warn); }
.verdict .glyph span { color: var(--surface); }
.answer { margin: 0; }
.answer .la { font-family: var(--f-latin); font-weight: 700; }
.small { margin: 0; font-size: 14px; color: var(--muted); }
.small em { font-family: var(--f-latin); }

.next-row { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

/* ---------- summary ---------- */
.sum-head { display: grid; gap: 4px; }
.sum-head h2 { margin: 0; font: 600 1.25rem/1.2 var(--f-display); letter-spacing: .04em; color: var(--accent); }
.score { margin: 0; font-size: clamp(2.2rem, 1.6rem + 3vw, 3rem); font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.score span { font-size: 1rem; font-weight: 600; color: var(--muted); margin-left: 6px; }
.review { display: grid; margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.review li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.review .la { font-family: var(--f-latin); font-weight: 700; overflow-wrap: anywhere; }
.review .en { overflow-wrap: anywhere; }
.review .x { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.sum-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- settings ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(18px, 4vw, 26px); display: grid; gap: 18px; min-width: 0; }
.panel h2 { margin: 0; font: 600 1.1rem/1.2 var(--f-display); letter-spacing: .04em; color: var(--accent); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 12px; align-items: baseline; width: 100%; }
legend .btn-link { font-size: 12px; letter-spacing: 0; text-transform: none; padding: 0; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { position: relative; display: inline-flex; }
.choice input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.choice span { display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-size: 15px; }
.choice small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.choice input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.choice input:checked + span small { color: var(--accent-ink); opacity: .8; }
@media (hover: hover) { .choice input:hover + span { border-color: var(--accent); } }
.choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips .choice span { border-radius: 99px; padding: 5px 12px; font-size: 14px; }
.chips .choice input:checked + span { background: var(--accent-soft); color: var(--accent); }
.chips .choice input:checked + span small { color: var(--accent); }
.chapters .choice span { min-width: 2.5em; justify-content: center; font-variant-numeric: tabular-nums; }
.panel-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid var(--line); padding-block-start: 16px; }
.match { margin: 0; font-size: 15px; color: var(--muted); }
.match strong { color: var(--ink); font-variant-numeric: tabular-nums; }

.keys { font-size: 13px; color: var(--muted); text-align: center; }
@media (hover: none) and (pointer: coarse) { .keys, .opt .key-hint, kbd { display: none; } }

@media (prefers-reduced-motion: no-preference) {
  .bar > div { transition: width .35s ease; }
  .opt, .choice span, .btn { transition: border-color .15s ease, background-color .15s ease, color .15s ease; }
  .card.enter { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow"><span class="nw">Vocabula discenda</span> · <span class="nw">Suburani 1–17</span></p>
      <h1>Latin Vocab Trainer</h1>
    </div>
    <button id="settingsBtn" class="btn btn-ghost" type="button" aria-expanded="false" aria-controls="settings">Settings</button>
  </header>

  <form id="settings" class="panel" hidden>
    <h2>Set up a round</h2>
    <fieldset>
      <legend>Word list</legend>
      <div class="choices" id="listChoices"></div>
    </fieldset>
    <fieldset>
      <legend>Question type</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="mode" value="mixed" id="mode-mixed" checked><span>Mixed</span></label>
        <label class="choice"><input type="radio" name="mode" value="mc" id="mode-mc"><span>Multiple choice only</span></label>
        <label class="choice"><input type="radio" name="mode" value="sa" id="mode-sa"><span>Short answer only</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Words per round</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="size" value="10" id="size-10"><span>10</span></label>
        <label class="choice"><input type="radio" name="size" value="20" id="size-20" checked><span>20</span></label>
        <label class="choice"><input type="radio" name="size" value="30" id="size-30"><span>30</span></label>
        <label class="choice"><input type="radio" name="size" value="50" id="size-50"><span>50</span></label>
        <label class="choice"><input type="radio" name="size" value="all" id="size-all"><span>All matching</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Parts of speech <button class="btn-link" type="button" data-all="pos">All</button><button class="btn-link" type="button" data-none="pos">None</button></legend>
      <div class="choices chips" id="posChoices"></div>
    </fieldset>
    <fieldset>
      <legend>Chapters <button class="btn-link" type="button" data-all="ch">All</button><button class="btn-link" type="button" data-none="ch">None</button></legend>
      <div class="choices chips chapters" id="chChoices"></div>
    </fieldset>
    <div class="panel-foot">
      <p class="match" id="matchCount"></p>
      <div class="sum-actions">
        <button class="btn btn-ghost" type="button" id="closeSettings">Back to round</button>
        <button class="btn btn-primary" type="submit" id="startBtn">Start round</button>
      </div>
    </div>
  </form>

  <section id="status" class="status" aria-label="Round progress">
    <div class="status-line">
      <span id="roundLabel"></span>
      <button class="btn-link" type="button" id="endBtn">End round</button>
    </div>
    <div class="bar" role="progressbar" aria-label="Words learned this round" aria-valuemin="0" id="bar"><div id="barFill"></div></div>
    <dl class="stats">
      <div><dt>Learned</dt><dd id="stLearned">0 / 0</dd></div>
      <div><dt>Right on first try</dt><dd id="stFirst">–</dd></div>
      <div><dt>Streak</dt><dd id="stStreak">0</dd></div>
    </dl>
  </section>

  <main id="card" class="card" tabindex="-1" aria-live="off">
    <div class="meta">
      <span class="pill" id="qPos"></span>
      <span id="qCh"></span>
      <span class="flag" id="qRetry" hidden>Try again</span>
      <span class="qtype" id="qType"></span>
    </div>
    <p class="prompt" id="prompt" lang="la"></p>
    <p class="instr" id="instr"></p>

    <div class="options" id="mcArea" role="group" aria-label="Answer choices"></div>

    <form class="sa" id="saArea" autocomplete="off" hidden>
      <label for="saInput" class="sr-only">English meaning</label>
      <input id="saInput" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Type the English meaning">
      <div class="sa-actions">
        <button class="btn btn-primary" type="submit" id="checkBtn">Check</button>
        <button class="btn btn-ghost" type="button" id="revealBtn">Show answer</button>
        <span class="hint" id="saHint" hidden>Type an answer first, or choose Show answer.</span>
      </div>
    </form>

    <div class="feedback" id="feedback" role="status" hidden></div>

    <div class="next-row" id="nextRow" hidden>
      <button class="btn btn-ghost" type="button" id="overrideBtn" hidden>Count it as correct</button>
      <button class="btn btn-primary" type="button" id="nextBtn">Next<kbd>Enter</kbd></button>
    </div>
  </main>

  <main id="summary" class="card" tabindex="-1" hidden></main>

  <p class="sr-only" id="announce" aria-live="polite"></p>
  <p class="keys" id="keys">Keys: <strong>A–D</strong> or <strong>1–4</strong> pick an answer · <strong>Enter</strong> checks and moves on</p>

  /* ---------- summary ---------- */
  function finish(early) {
    if (!R || R.finished) return;
    R.finished = true; R.endedEarly = early && R.done < R.total; Q = null;
    const seen = R.first.size;
    const right = [...R.first.values()].filter(Boolean).length;
    const missed = R.words.filter(w => R.first.get(w.id) === false);
    const kids = [
      el('div', { class: 'sum-head' },
        el('h2', null, R.endedEarly ? 'Round ended' : 'Round complete'),
        el('p', { class: 'small' }, R.label + ' · ' + MODE_NAME[R.mode])),
      el('p', { class: 'score' }, right + ' / ' + seen, el('span', null, 'right on the first try')),
      el('p', { class: 'small' }, [
        seen ? Math.round((100 * right) / seen) + '% first-try accuracy' : 'No words answered',
        'best streak ' + R.best,
        R.endedEarly ? (R.total - R.done) + ' of ' + R.total + ' words not finished' : null,
      ].filter(Boolean).join(' · ')),
    ];
    if (missed.length) {
      kids.push(el('p', { class: 'small' }, el('strong', null, 'Review these ' + missed.length + ' word' + (missed.length === 1 ? '' : 's'))));
      kids.push(el('ul', { class: 'review' }, missed.map(w => el('li', null,
        el('span', { class: 'la', lang: 'la' }, w.prompt),
        el('span', { class: 'en' }, w.e),
        R.misses.get(w.id) > 1 ? el('span', { class: 'x' }, 'Missed ' + R.misses.get(w.id) + ' times') : null))));
    } else if (seen && !R.endedEarly) {
      kids.push(el('p', { class: 'answer' }, el('span', { class: 'la', lang: 'la' }, 'Optimē!'), ' Every word right on the first try.'));
    }
    const actions = el('div', { class: 'sum-actions' });
    if (missed.length) {
      const b = el('button', { class: 'btn btn-primary', type: 'button' }, 'Practice these ' + missed.length);
      b.addEventListener('click', () => startRound(missed, 'Missed words from last round'));
      actions.append(b);
    }
    const again = el('button', { class: 'btn ' + (missed.length ? 'btn-ghost' : 'btn-primary'), type: 'button' }, 'New round');
    again.addEventListener('click', () => { const words = matching(); if (words.length) startRound(words, null); else openSettings(); });
    const set = el('button', { class: 'btn btn-ghost', type: 'button' }, 'Change settings');
    set.addEventListener('click', openSettings);
    actions.append(again, set);
    kids.push(actions);
    const s = $('summary');
    s.replaceChildren(...kids);
    $('card').hidden = true; s.hidden = false;
    updateStatus();
    $('announce').textContent = 'Round finished. ' + right + ' of ' + seen + ' right on the first try.';
    if (s.getBoundingClientRect().top < 0) s.scrollIntoView({ block: 'start' });
    s.focus({ preventScroll: true });
  }
  $('endBtn').addEventListener('click', () => finish(true));

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!$('settings').hidden) { if (e.key === 'Escape' && R) closeSettings(); return; }
    if (!Q) return;
    const tag = e.target && e.target.tagName;
    if (Q.type === 'mc' && !Q.answered) {
      const k = e.key.toLowerCase();
      let i = 'abcd'.indexOf(k);
      if (i < 0) i = '1234'.indexOf(k);
      if (k.length === 1 && i >= 0 && i < Q.options.length) { e.preventDefault(); answerMC(i); }
      return;
    }
    if (Q.answered && e.key === 'Enter' && tag !== 'INPUT' && tag !== 'BUTTON') { e.preventDefault(); next(); }
  });

  startRound(matching(), null);
})();
</script>
